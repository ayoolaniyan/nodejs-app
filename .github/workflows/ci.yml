name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The Prisma client is generated code and is not committed, so it has
      # to exist before anything that imports @prisma/client is compiled.
      - run: npm run prisma:generate

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run test:e2e
